<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulte seu CPF</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, Arial, sans-serif; background: #f5f5f5; color: #222; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #fff; border-radius: 12px; padding: 40px 32px; max-width: 480px; width: 100%; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    h1 { font-size: 26px; font-weight: 800; color: #1a1a1a; margin-bottom: 16px; line-height: 1.3; }
    p { font-size: 16px; color: #555; line-height: 1.7; margin-bottom: 32px; }
    .btn { display: block; background: #168821; color: #fff; font-size: 18px; font-weight: 700; padding: 18px; border-radius: 8px; text-decoration: none; width: 100%; }
    .btn:hover { background: #0e5c16; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Consulte seu CPF</h1>
    <p>Verifique sua situação financeira em segundos. Veja as opções disponíveis para organizar suas finanças.</p>
    <a href="https://desenrolanegocia.vercel.app" class="btn">Consultar agora</a>
  </div>
</body>
</html>
